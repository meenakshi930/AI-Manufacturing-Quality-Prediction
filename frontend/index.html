<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manufacturing Quality Prediction</title>
</head>

<body>

<h2>Manufacturing Defect Prediction</h2>

<form id="prediction-form">

  <input name="temperature" type="number" placeholder="Temperature" required /><br>
  <input name="pressure" type="number" placeholder="Pressure" required /><br>
  <input name="humidity" type="number" placeholder="Humidity" required /><br>
  <input name="vibration_level" type="number" placeholder="Vibration Level" required /><br>

  <!-- Dummy values for remaining features (adjust if needed) -->
  <input name="feature5" type="number" value="10" required hidden />
  <input name="feature6" type="number" value="20" required hidden />
  <input name="feature7" type="number" value="30" required hidden />
  <input name="feature8" type="number" value="40" required hidden />
  <input name="feature9" type="number" value="50" required hidden />
  <input name="feature10" type="number" value="60" required hidden />
  <input name="feature11" type="number" value="70" required hidden />
  <input name="feature12" type="number" value="80" required hidden />
  <input name="feature13" type="number" value="90" required hidden />
  <input name="feature14" type="number" value="100" required hidden />
  <input name="feature15" type="number" value="110" required hidden />
  <input name="feature16" type="number" value="120" required hidden />

  <button type="submit">Predict</button>
</form>

<h3 id="result">Result will appear here</h3>

<hr>

<h3>Batch Prediction (CSV)</h3>

<form id="batch-form">
  <input type="file" name="file" accept=".csv" required />
  <button type="submit">Upload CSV</button>
</form>

<script>
const API_BASE = "http://127.0.0.1:5000";

// 🔹 Single Prediction
document.getElementById("prediction-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const formData = new FormData(this);
  const data = {};

  formData.forEach((value, key) => {
    data[key] = Number(value);
  });

  document.getElementById("result").innerText = "Processing...";

  try {
    const res = await fetch(API_BASE + "/predict", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    document.getElementById("result").innerText =
      `Prediction: ${result.label} | Confidence: ${result.confidence}`;

  } catch (err) {
    document.getElementById("result").innerText = "Error connecting to API";
    console.error(err);
  }
});

// 🔹 Batch Prediction
document.getElementById("batch-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const formData = new FormData(this);

  try {
    const res = await fetch(API_BASE + "/predict-batch", {
      method: "POST",
      body: formData
    });

    const result = await res.json();

    alert("Batch prediction completed! Check console.");

    console.log(result);

  } catch (err) {
    alert("Batch upload failed");
    console.error(err);
  }
});
</script>

</body>
</html>
