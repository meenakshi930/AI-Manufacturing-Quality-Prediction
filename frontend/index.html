<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Manufacturing Quality</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">
  <h1>Manufacturing Quality Prediction</h1>

  <form id="prediction-form">
    <input name="temperature" type="number" step="any" placeholder="Temperature" required>
    <input name="pressure" type="number" step="any" placeholder="Pressure" required>
    <input name="humidity" type="number" step="any" placeholder="Humidity" required>
    <input name="vibration_level" type="number" step="any" placeholder="Vibration Level" required>

    <!-- hidden features -->
    <input name="feature5" value="10" hidden>
    <input name="feature6" value="20" hidden>
    <input name="feature7" value="30" hidden>
    <input name="feature8" value="40" hidden>
    <input name="feature9" value="50" hidden>
    <input name="feature10" value="60" hidden>
    <input name="feature11" value="70" hidden>
    <input name="feature12" value="80" hidden>
    <input name="feature13" value="90" hidden>
    <input name="feature14" value="100" hidden>
    <input name="feature15" value="110" hidden>
    <input name="feature16" value="120" hidden>

    <button type="submit">Predict</button>
  </form>

  <div id="result">Result will appear here</div>

  <div class="batch">
    <h3>Batch Prediction</h3>
    <form id="batch-form">
      <input type="file" name="file" accept=".csv" required>
      <button type="submit">Upload CSV</button>
    </form>
  </div>

</div>

<!-- JS -->
<script src="app.js"></script>

</body>
</html>
